# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# Any npm package version must have been published for at least 1 day (1440
# minutes) before pnpm will install it. Malicious npm releases are usually
# discovered and pulled within hours, so a 1-day delay is a strong buffer.
#
# DO NOT DISABLE THIS SETTING. If an urgent security fix must land inside the
# window, add the single package to `minimumReleaseAgeExclude` below and remove
# the exclusion once the window has passed.
# ============================================================================
minimumReleaseAge: 1440

# esbuild ships a platform-specific binary and needs its postinstall script to
# run. pnpm 10 blocks lifecycle scripts by default, so allow this one explicitly.
onlyBuiltDependencies:
  - esbuild
